<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>stream talker · mixed</title>
<meta name="description" content="Read forward one section at a time while highlighting visible passages and leaving notes for the next turn.">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0f15'/%3E%3Cpath d='M32 11c2 13 8 19 21 21-13 2-19 8-21 21-2-13-8-19-21-21 13-2 19-8 21-21z' fill='%238f9bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/app/theme.css">
<link rel="stylesheet" href="/app/experiments.css">
</head>
<body data-experiment="mixed">
<div class="experiment-app">
  <header class="site-header">
    <div class="brand"><span class="brand-mark">✦</span>stream<b>talker</b></div>
    <nav class="header-nav seg-nav" aria-label="Experiments">
      <a href="/">v1 · speculative</a>
      <a href="/annotation">annotate</a>
      <a href="/mixed" aria-current="page">mixed</a>
      <a href="/trajectories">replay</a>
    </nav>
    <label class="switch guided-switch" title="Use the experimental guidance prompt and cohesive chunking">
      <input id="guided" type="checkbox"><span>guided</span>
    </label>
    <div id="status" class="status-pill"><span class="dot" id="dot"></span><span id="statustext">ready</span></div>
  </header>

  <main id="chat">
    <div class="empty" id="empty">
      <div class="empty-mark">✦</div>
      <h2 class="empty-title">Read forward, mark as you go</h2>
      <p>One section at a time, like v1 — and any visible passage can be highlighted and annotated for the next turn.</p>
    </div>
  </main>

  <aside class="annotation-dock">
  <section class="annotation-panel" id="annotation-panel" hidden>
    <div class="annotation-panel-head">
      <span><b id="annotation-count">0</b> annotations</span>
      <button id="respond" type="button">Respond to annotations</button>
    </div>
    <div class="annotation-list" id="annotation-list"></div>
  </section>

  <section class="selection-tray" id="selection-tray" hidden>
    <div class="selection-quote" id="selection-quote"></div>
    <textarea id="annotation-input" rows="2" placeholder="What should the assistant know about this passage?"></textarea>
    <div class="tray-actions"><button id="cancel-selection" type="button">Cancel</button><button class="primary" id="add-annotation" type="button">Add annotation</button></div>
  </section>
  </aside>

  <footer>
    <div class="actions"><button id="continue" type="button"><span class="continue-label"><span class="continue-label-text continue-label-continue">Continue</span><span class="continue-label-text continue-label-catchup">Catch up</span><span class="continue-label-text continue-label-pending">Continuing…</span></span><kbd>⏎</kbd></button></div>
    <div class="composer"><textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button id="send" type="button" title="Send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button></div>
    <div class="hint">Select text to annotate · Enter sends / catches up · Shift+Enter adds a line</div>
  </footer>
</div>
<script src="/app/experiments.js"></script>
<script src="/app/byo.js" defer></script>
</body>
</html>

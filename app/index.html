<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0f15'/%3E%3Cpath d='M32 11c2 13 8 19 21 21-13 2-19 8-21 21-2-13-8-19-21-21 13-2 19-8 21-21z' fill='%238f9bff'/%3E%3C/svg%3E">

<body>
<div class="app">

  <nav class="header-nav seg-nav" aria-label="Experiments">

  <label class="switch guided-switch" title="Use the experimental guidance prompt and cohesive chunking">

  </label>

<main id="chat">
  <div class="empty" id="empty">
    <div class="empty-mark">✦</div>

    <div class="chips">

      <button type="button" class="chip" data-prompt="What happens to buffered text if I send a real message?">What drops the buffer?</button>

    </div>
  </div>
</main>
<footer>
  <div class="actions"><button id="continue" type="button"><span id="continuetext" class="continue-label"><span class="continue-label-text continue-label-continue">Continue</span><span class="continue-label-text continue-label-catchup">Catch up</span><span class="continue-label-text continue-label-pending">Continuing…</span></span><kbd>⏎</kbd></button></div>
  <div class="composer"><textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button id="send" type="button" title="Send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button></div>
  <div class="hint">Enter sends · empty Enter catches up / continues · short acknowledgements keep the speculative draft</div>
</footer>
</div>
<script src="/app/byo.js" defer></script>
<script>
// ---- demo mock: intercepts fetch so this page runs standalone, no server/API key ----
if(location.protocol==='file:'||new URLSearchParams(location.search).has('demo'))(function(){
  var REPLIES=[
    'Hey! Great to meet you.\n\nThis build is running against a mock backend, so no API key is needed — the first paragraph streams live, while the rest is drafted into the hidden buffer.\n\nPress Continue (or Enter on an empty box) whenever you want the next piece.',
    'Exactly — that one replayed from the buffer at the model\'s own pace instead of dumping the whole paragraph at once.\n\nShort reactions like "yeah" or "lol" keep the same turn alive.\n\nA real message starts a fresh turn and drops whatever was still hidden.',
    'That\'s the whole loop: live first chunk, speculative buffer behind it, and only what you actually saw is ever sent back as context.\n\nWant to watch buffering again? Just ask me something else.'
  ];
  var turnCount=0, active=null;
  var enc=new TextEncoder();

  function mockTurn(reply){
    var chunks=reply.split(/\n\n+/),timers=[],closed=false;
    var buffered=0,nextToReveal=1,generated=1,done=false,pending=false,c=null;
    function later(fn,ms){timers.push(setTimeout(function(){if(!closed)fn();},ms));}
    function emit(obj){if(closed)return;try{c.enqueue(enc.encode('data: '+JSON.stringify(obj)+'\n\n'));}catch(e){closed=true;}}
    function state(generating,waiting){emit({type:'state',status:generating?'streaming':'generated',hidden:buffered,generating:generating,waiting:!!waiting,cps:170});}
    function finishIfDone(){if(done&&buffered===0&&!pending){emit({type:'turn_end',status:'done'});closed=true;try{c.close();}catch(e){}}}
    function reveal(){
      if(nextToReveal<generated){
        if(buffered>0)buffered--;
        var i=nextToReveal++;
        emit({type:'chunk_open',index:i,initial:chunks[i],replay:true,cps:170});
        emit({type:'chunk_end',index:i});
        state(!done);
        finishIfDone();
        return {ok:true,index:i,replay:true};
      }
      if(!done){pending=true;state(true,true);return {ok:true,waiting:true};}
      finishIfDone();
      return {ok:true,done:true};
    }
    function genRest(){
      if(generated>=chunks.length){done=true;emit({type:'generation_end',hidden:buffered,cps:170});finishIfDone();return;}
      generated++;
      if(pending){pending=false;reveal();}
      else{buffered++;state(true);}
      later(genRest,1100);
    }
    function start(controller){
      c=controller;
      emit({type:'turn',turnId:'demo'+turnCount});
      emit({type:'state',status:'starting',hidden:0,generating:true,waiting:false});
      emit({type:'chunk_open',index:0,initial:'',cps:170});
      var parts=chunks[0].split(/(\s+)/),p=0;
      (function step(){
        if(closed)return;
        if(p>=parts.length){emit({type:'chunk_end',index:0});state(true);later(genRest,700);return;}
        var frag=parts[p]+(parts[p+1]||'');p+=2;
        emit({type:'delta',index:0,t:frag,cps:170});
        later(step,24);
      })();
    }
    return {start:start,reveal:function(){return reveal();},cancel:function(){closed=true;timers.forEach(clearTimeout);}};
  }

  function jsonResponse(obj){return new Response(JSON.stringify(obj),{status:200,headers:{'content-type':'application/json'}});}

  window.fetch=function(url,opt){
    opt=opt||{};url=String(url);
    if(url.indexOf('/api/stream')===0){
      if(active)active.cancel();
      var reply=REPLIES[Math.min(turnCount,REPLIES.length-1)];turnCount++;
      var turn=mockTurn(reply);
      var stream=new ReadableStream({start:function(c){turn.start(c);},cancel:function(){turn.cancel();}});
      active=turn;
      if(opt.signal)opt.signal.addEventListener('abort',function(){turn.cancel();});
      return Promise.resolve(new Response(stream,{status:200,headers:{'content-type':'text/event-stream'}}));
    }
    if(/\/api\/turns\/[\w-]+\/continue$/.test(url))return Promise.resolve(jsonResponse(active?active.reveal():{error:'no such turn'}));
    if(/\/api\/turns\/[\w-]+\/cancel$/.test(url)){if(active)active.cancel();return Promise.resolve(jsonResponse({ok:true}));}
    if(/\/api\/turns\/[\w-]+$/.test(url))return Promise.resolve(jsonResponse({status:'streaming'}));
    return Promise.reject(new Error('demo mock: no route for '+url));
  };

  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('span');b.className='badge';b.textContent='demo · mocked backend';
    document.querySelector('header').insertBefore(b,document.getElementById('status'));
  });
})();
</script>
<script>
(function(){
'use strict';
var chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),guidedInput=document.getElementById('guided');
var continueBtn=document.getElementById('continue'),dot=document.getElementById('dot'),statusText=document.getElementById('statustext');

var ACKS=new Set(('yeah yep yup yea yes yesss ok okay k kk sure right exactly indeed true fair gotcha lol lmao haha hahaha ha hehe nice cool wow whoa ooh aah dope sick awesome noice thanks thx oh ah hm mm mhm mhmm uhuh interesting aight bet').split(' '));
function isAck(text){
  var t=text.trim().toLowerCase().replace(/[.,!?;:'"()\[\]{}]+/g,' ').replace(/\s+/g,' ').trim();
  if(!t)return false;
  if(ACKS.has(t))return true;
  if(/^(i see|got it|makes sense|that makes sense|fair enough|sounds good|oh+ (ok|okay|yeah)|yeah+|yep+|ok+|ha+|lol+|lmao+)$/.test(t))return true;
  var words=t.split(' ');return words.length<=3&&words.every(function(w){return ACKS.has(w);});
}

var state={
  turnId:null,
  timeline:[],
  streamCtrl:null,
  generating:false,
  continuePending:false,
  hidden:0,
  current:null,
  lastAssistant:false,
  cps:0,
  sessionId:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
  sessionSeq:0,
  turnEnded:false,
  guided:false,
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(s){
  if(!s)return '';
  var h=esc(s),blocks=[];
  h=h.replace(/```([\s\S]*?)```/g,function(_,c){blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return '\u0001'+(blocks.length-1)+'\u0001';});
  h=h.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>').replace(/^##\s+(.+)$/gm,'<h2>$1</h2>').replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  var lines=h.split('\n'),out=[],list=null,para=[];
  function flushPara(){if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[];}}
  function flushList(){if(list){out.push('</'+list+'>');list=null;}}
  lines.forEach(function(line){
    var hr=line.match(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/);
    var u=line.match(/^\s*[-*+]\s+(.+)$/),o=line.match(/^\s*\d+\.\s+(.+)$/);
    if(hr){flushPara();flushList();out.push('<hr>');return;}
    if(u){flushPara();if(list!=='ul'){flushList();out.push('<ul>');list='ul';}out.push('<li>'+u[1]+'</li>');return;}
    if(o){flushPara();if(list!=='ol'){flushList();out.push('<ol>');list='ol';}out.push('<li>'+o[1]+'</li>');return;}
    flushList();
    if(/^\s*<(h\d|pre)/.test(line)||/^\u0001\d+\u0001$/.test(line)){flushPara();out.push(line);return;}
    if(!line.trim()){flushPara();return;}
    para.push(line);
  });
  flushList();flushPara();
  h=out.join('\n').replace(/\u0001(\d+)\u0001/g,function(_,i){return blocks[+i];});
  return h;
}

function scrollDown(){chat.scrollTop=chat.scrollHeight;}
function setStatus(text,live){statusText.textContent=text;dot.className='dot'+(live?' live':(text==='complete'?' ok':''));}
function row(role,text,ack){
  var e=document.getElementById('empty');if(e)e.remove();
  var r=document.createElement('div');r.className='row '+(ack?'ack':role);
  if(role==='assistant'&&!ack){var av=document.createElement('div');av.className='avatar';av.textContent='✦';r.appendChild(av);}
  var m=document.createElement('div');m.className='msg';m.innerHTML=md(text||'');r.appendChild(m);chat.appendChild(r);scrollDown();return {row:r,msg:m};
}
var THREAD_KEY='unfold_thread_speculative';
function saveThread(){
  try{sessionStorage.setItem(THREAD_KEY,JSON.stringify({sessionId:state.sessionId,sessionSeq:state.sessionSeq,guided:state.guided,timeline:state.timeline.slice(-40)}));}catch(e){}
}
function restoreThread(){
  var saved=null,returning=false;
  try{returning=sessionStorage.getItem('byo_oauth_return')==='1';}catch(e){}
  try{sessionStorage.removeItem('byo_oauth_return');}catch(e){}
  if(!returning){try{sessionStorage.removeItem(THREAD_KEY);}catch(e){}return;}
  try{saved=JSON.parse(sessionStorage.getItem(THREAD_KEY)||'null');}catch(e){}
  if(!saved||!saved.timeline||!saved.timeline.length)return;
  state.sessionId=saved.sessionId||state.sessionId;
  state.sessionSeq=saved.sessionSeq||0;
  state.guided=!!saved.guided;
  guidedInput.checked=state.guided;
  saved.timeline.forEach(function(m){row(m.role,m.content,false);});
  state.lastAssistant=saved.timeline[saved.timeline.length-1].role==='assistant';
}
function addTimeline(role,content){if(content){state.timeline.push({role:role,content:content});saveThread();}}
function addUser(text,ack){row('user',text,ack);addTimeline('user',text);state.lastAssistant=false;}

function newAssistantSegment(){
  var r=row('assistant','',false);if(state.lastAssistant)r.row.classList.add('continuation');
  state.lastAssistant=true;return r;
}
function ensureCurrentElement(){
  var c=state.current;if(!c)return null;
  if(!c.node)c.node=newAssistantSegment();return c.node.msg;
}
function renderCurrent(){
  var c=state.current;if(!c||!c.node)return;
  var local=c.rendered.slice(c.segmentStart);
  var tail='';
  if(!c.finalized)tail=local?'<span class="caret"></span>':'<span class="typing"><i></i><i></i><i></i></span>';
  c.node.msg.innerHTML=md(local)+tail;scrollDown();
}
function commitRenderedPrefix(){
  var c=state.current;if(!c)return;
  var local=c.rendered.slice(c.segmentStart);
  if(local){
    ensureCurrentElement();
    c.node.msg.innerHTML=md(local);
    addTimeline('assistant',local);
    c.segmentStart=c.rendered.length;
    c.node=null;
  }else if(c.node){
    c.node.row.remove();
    c.node=null;
  }
}

function stopReplay(){
  var c=state.current;if(c&&c.raf){cancelAnimationFrame(c.raf);c.raf=0;}
}
function replayFrame(ts){
  var c=state.current;if(!c||!c.replaying)return;
  if(!c.replayStartAt){c.replayStartAt=ts;c.replayBaseLen=c.rendered.length;}
  var cps=c.replayCps||state.cps||180;
  var want=Math.min(c.target.length,c.replayBaseLen+Math.floor(cps*(ts-c.replayStartAt)/1000));
  if(want>c.rendered.length){c.rendered=c.target.slice(0,want);ensureCurrentElement();renderCurrent();}
  if(c.rendered.length>=c.target.length){
    // Once replay reaches the provider's current frontier, this chunk follows
    // new deltas live. A still-generating chunk never gets a second hidden
    // phase after the user has chosen to reveal it.
    c.replaying=false;c.replayStartAt=0;c.replayBaseLen=c.rendered.length;
    if(c.ended)finishCurrentChunk();
    return;
  }
  c.raf=requestAnimationFrame(replayFrame);
}
function startReplay(){
  var c=state.current;if(!c||c.replaying)return;
  c.replaying=true;c.replayStartAt=0;c.replayBaseLen=c.rendered.length;c.replayCps=state.cps||c.replayCps||180;
  c.raf=requestAnimationFrame(replayFrame);
}

// Enter while cached text is being animated means: catch the renderer up to
// the speculative buffer frontier NOW. If the whole chunk is already buffered
// this completes it instantly; if generation is still extending the chunk,
// future upstream deltas continue live from this exact point.
function catchUpCurrent(){
  var c=state.current;if(!c)return false;
  if(c.rendered.length>=c.target.length&&!c.replaying)return false;
  stopReplay();c.replaying=false;c.replayStartAt=0;c.replayBaseLen=c.target.length;
  c.rendered=c.target;ensureCurrentElement();renderCurrent();
  if(c.ended)finishCurrentChunk();
  else updateContinue();
  return true;
}
function finishCurrentChunk(){
  var c=state.current;if(!c||c.finalized||c.rendered.length<c.target.length)return;
  c.finalized=true;stopReplay();
  var local=c.rendered.slice(c.segmentStart);
  if(local){ensureCurrentElement();c.node.msg.innerHTML=md(local);addTimeline('assistant',local);}
  else if(c.node)c.node.row.remove();
  state.current=null;state.lastAssistant=true;scrollDown();
  if(state.turnEnded&&state.hidden===0)setStatus('complete',false);
  updateContinue();
}
function abandonCurrent(){
  var c=state.current;if(!c)return;
  stopReplay();commitRenderedPrefix();
  if(c.node)c.node.row.remove();
  state.current=null;
}

function onChunkOpen(d){
  // A previous chunk should normally have ended first; tolerate provider/UI races.
  if(state.current&&state.current.index!==d.index){finishCurrentChunk();}
  if(Number(d.cps)>0)state.cps=Number(d.cps);
  var initial=String(d.initial||'');
  state.current={index:d.index,target:initial,rendered:'',segmentStart:0,node:null,ended:false,finalized:false,replaying:false,raf:0,replayStartAt:0,replayBaseLen:0,replayCps:state.cps||180,paint:0};
  state.continuePending=false;updateContinue();
  ensureCurrentElement();
  if(initial)startReplay();
  else renderCurrent();
}
function onDelta(d){
  var c=state.current;
  if(!c||c.index!==d.index){onChunkOpen({index:d.index,initial:'',cps:d.cps});c=state.current;}
  if(Number(d.cps)>0)state.cps=Number(d.cps);
  var frag=String(d.t||'');c.target+=frag;
  if(c.replaying){return;}
  // Live upstream fragment: render on the next paint, with no artificial delay.
  c.rendered=c.target;ensureCurrentElement();
  if(!c.paint){c.paint=requestAnimationFrame(function(){if(state.current===c){c.paint=0;renderCurrent();}});}
}
function onChunkEnd(d){
  var c=state.current;if(!c||c.index!==d.index)return;c.ended=true;
  if(c.replaying||c.rendered.length<c.target.length){startReplay();return;}finishCurrentChunk();
}

function updateContinue(){
  var c=state.current,behind=!!(c&&c.rendered.length<c.target.length);
  // Continue means "there is another readable frontier", not "the model is
  // still working". TTFT, the live first chunk, and gaps between chunks stay
  // quiet; the button appears when a later chunk has produced text.
  var canContinue=!state.turnEnded&&state.hidden>0;
  var show=!!state.turnId&&(behind||canContinue);
  continueBtn.classList.toggle('on',show);
  continueBtn.classList.toggle('catch-up',behind);
  continueBtn.classList.toggle('pending',state.continuePending&&!behind);
  continueBtn.disabled=!show;
}

function handleEvent(d){
  if(d.type==='turn'){
    state.turnId=d.turnId;state.generating=true;state.turnEnded=false;setStatus('generating…',true);return;
  }
  if(d.type==='quota'){window.dispatchEvent(new CustomEvent('quota-exhausted',{detail:d}));return;}
  if(d.type==='chunk_open'){onChunkOpen(d);return;}
  if(d.type==='delta'){onDelta(d);return;}
  if(d.type==='chunk_end'){onChunkEnd(d);return;}
  if(d.type==='state'){
    state.generating=!!d.generating;state.hidden=Number(d.hidden||0);state.continuePending=!!d.waiting;if(Number(d.cps)>0)state.cps=Number(d.cps);
    if(state.generating)setStatus(state.hidden?'generating · '+state.hidden+' buffered':'generating…',true);
    else if(state.hidden)setStatus(state.hidden+' buffered',false);
    updateContinue();return;
  }
  if(d.type==='generation_end'){
    state.generating=false;state.hidden=Number(d.hidden||0);if(Number(d.cps)>0)state.cps=Number(d.cps);
    setStatus(state.hidden?state.hidden+' buffered':'complete',false);updateContinue();return;
  }
  if(d.type==='turn_end'){
    state.generating=false;state.continuePending=false;state.turnEnded=d.status==='done';
    if(d.status==='error')setStatus('error: '+(d.error||'generation failed'),false);
    else if(d.status==='superseded'){} else if(!state.current)setStatus('complete',false);
    updateContinue();return;
  }
}

function consumeSse(response,ctrl){
  if(!response.ok||!response.body)throw new Error('stream HTTP '+response.status);
  var reader=response.body.getReader(),dec=new TextDecoder(),buf='';
  function pump(){return reader.read().then(function(x){
    if(x.done)return;
    buf+=dec.decode(x.value,{stream:true});
    var split;
    while((split=buf.indexOf('\n\n'))>=0){
      var frame=buf.slice(0,split);buf=buf.slice(split+2);
      var data=frame.split(/\r?\n/).filter(function(l){return l.indexOf('data:')===0;}).map(function(l){return l.slice(5).replace(/^ /,'');}).join('\n');
      if(data){try{handleEvent(JSON.parse(data));}catch(_){}}
    }
    return pump();
  });}
  return pump();
}

function startInference(supersedeId){
  if(state.streamCtrl){try{state.streamCtrl.abort();}catch(_){}}
  var ctrl=new AbortController();state.streamCtrl=ctrl;
  state.turnId=null;state.generating=true;state.hidden=0;state.continuePending=false;state.lastAssistant=false;state.turnEnded=false;updateContinue();setStatus('connecting…',true);
  state.sessionSeq++;
  fetch('/api/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({history:state.timeline,presentation:'speculative',guided:state.guided,supersede:supersedeId||null,sessionId:state.sessionId,sessionSeq:state.sessionSeq}),signal:ctrl.signal})
    .then(function(r){return consumeSse(r,ctrl);})
    .catch(function(e){if(ctrl.signal.aborted)return;setStatus('request failed: '+e.message,false);state.generating=false;updateContinue();});
}

function requestContinue(){
  if(!state.turnId||state.continuePending)return;
  state.continuePending=true;updateContinue();
  fetch('/api/turns/'+state.turnId+'/continue',{method:'POST'})
    .then(function(r){return r.json();}).then(function(d){
      if(d.error){state.continuePending=false;updateContinue();setStatus('continue failed: '+d.error,false);return;}
      state.continuePending=!!d.waiting;updateContinue();
    }).catch(function(e){state.continuePending=false;updateContinue();setStatus('continue failed: '+e.message,false);});
}
function doContinue(){
  if(!state.turnId)return;
  // First Enter is always a local catch-up if the renderer is behind the
  // already-generated buffer. It never waits for the typing animation.
  if(catchUpCurrent())return;
  requestContinue();
}

function sendText(text){
  text=text.trim();if(!text)return doContinue();
  var ack=isAck(text)&&!!state.turnId&&!state.turnEnded;

  // Freeze exactly what has reached the screen before recording the user's
  // reaction. Anything generated but not rendered stays out of timeline.
  if(state.current)commitRenderedPrefix();
  addUser(text,ack);
  input.value='';input.style.height='auto';

  if(ack){
    // Same inference continues. New assistant text, even from the same semantic
    // chunk, gets a new bubble after the ACK so the reaction stays localized.
    if(state.current){state.current.node=null;state.current.segmentStart=state.current.rendered.length;}
    if(state.hidden>0||state.generating)doContinue();
    return;
  }

  var old=state.turnId;
  abandonCurrent();
  if(state.streamCtrl){try{state.streamCtrl.abort();}catch(_){}}
  startInference(old);
}

document.querySelectorAll('.chip[data-prompt]').forEach(function(chip){
  chip.addEventListener('click',function(){
    input.value=chip.dataset.prompt;
    input.dispatchEvent(new Event('input'));
    sendText(input.value);
  });
});

continueBtn.addEventListener('click',doContinue);
guidedInput.addEventListener('change',function(){state.guided=guidedInput.checked;saveThread();});
sendBtn.addEventListener('click',function(){sendText(input.value);});
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText(input.value);}});
input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
restoreThread();
input.focus();
})();
</script>
</body>
</html>
